# /etc/nginx/sites-available/workvoice
# Remplacer workvoice.example.com par votre domaine, puis :
#   ln -s /etc/nginx/sites-available/workvoice /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d workvoice.example.com      # HTTPS gratuit (Let's Encrypt)

server {
    listen 80;
    listen [::]:80;
    server_name workvoice.example.com;

    # Interface (fichiers statiques Next.js)
    root /var/www/workvoice/site;
    index index.html;

    # Pièces jointes : 5 Mo max côté API (marge pour l'encodage multipart)
    client_max_body_size 6m;

    # En-têtes de sécurité
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API Node.js (même origine que le site : cookies first-party, pas de CORS)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Ressources versionnées : cache long
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pages : /rh/ → /rh/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
