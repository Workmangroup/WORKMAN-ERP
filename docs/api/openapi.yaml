openapi: 3.1.0
info:
  title: WORKMAN ERP 360 — API
  version: 0.1.0
  description: |
    API REST versionnée du ERP. Authentification : jeton d'accès Supabase (en-tête Authorization: Bearer).
    Les droits sont appliqués par PostgreSQL (RLS) : une ressource non autorisée apparaît comme absente.
servers:
  - url: http://localhost:8000
    description: Développement local
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Vérification de vie
      security: []
      responses:
        '200':
          description: API et base joignables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Base injoignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/clients:
    get:
      summary: Liste des clients actifs de la société
      description: Droit requis clients.read (appliqué par la base). Sans droit, la liste est vide.
      parameters:
        - name: q
          in: query
          description: Recherche sur nom, raison sociale, code, identifiant fiscal, e-mail, téléphone (insensible à la casse)
          schema:
            type: string
            maxLength: 80
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: country
          in: query
          schema:
            type: string
            pattern: '^[A-Za-z]{2}$'
        - name: currency
          in: query
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
        - name: terms
          in: query
          description: Identifiant des conditions de paiement
          schema:
            type: string
            format: uuid
        - name: rep
          in: query
          description: Identifiant du commercial, ou « none » pour les clients sans commercial
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, code, recent, updated]
            default: name
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Page de clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      summary: Création d'un client
      description: Droit requis clients.write (appliqué par la base). Le numéro client est attribué par la base s'il n'est pas fourni.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '201':
          description: Client créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/clients/{id}:
    get:
      summary: Fiche d'un client
      description: "Tous les champs du client. Absent ou non accessible : 404."
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Fiche du client
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Suppression définitive d'un client archivé
      description: Permission clients.delete. Le client doit être archivé (CLIENT_NOT_ARCHIVED sinon) et ne doit être référencé par aucun module (CLIENT_IN_USE). La confirmation « SUPPRIMER » est obligatoire. La réponse liste les fichiers GED à retirer du stockage.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  enum: [SUPPRIMER]
      responses:
        '200':
          description: Client supprimé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      deleted: { type: boolean }
                      storage:
                        type: array
                        items:
                          type: object
                          properties:
                            bucket: { type: string }
                            path: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    patch:
      summary: Modification partielle d'un client
      description: Seuls les champs envoyés sont modifiés. Un client absent, archivé ou non accessible répond 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '200':
          description: Client modifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/clients/{id}/archive:
    post:
      summary: Archiver un client
      description: Permission clients.delete. Motif facultatif (300 caractères maximum). Le client archivé ne se modifie plus.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300, nullable: true }
      responses:
        '200':
          description: Client archivé
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/clients/{id}/restore:
    post:
      summary: Restaurer un client archivé
      description: Permission clients.delete.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Client restauré
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/clients/{client}/contacts:
    get:
      summary: Contacts d'un client
      description: Contact principal en premier, puis par nom.
      parameters:
        - $ref: '#/components/parameters/ClientPath'
      responses:
        '200':
          description: Liste des contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      summary: Ajouter un contact
      description: Permission clients.write.
      parameters:
        - $ref: '#/components/parameters/ClientPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Contact créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/contacts/{id}:
    patch:
      summary: Modifier un contact
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: Contact modifié
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      summary: Supprimer un contact
      description: "Absent ou non autorisé : 404 (aucune information n'est divulguée)."
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Contact supprimé
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/clients/{client}/addresses:
    get:
      summary: Adresses d'un client
      parameters:
        - $ref: '#/components/parameters/ClientPath'
      responses:
        '200':
          description: Liste des adresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      summary: Ajouter une adresse
      description: Permission clients.write.
      parameters:
        - $ref: '#/components/parameters/ClientPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Adresse créée
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/addresses/{id}:
    patch:
      summary: Modifier une adresse
      parameters:
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Adresse modifiée
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      summary: Supprimer une adresse
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: Adresse supprimée
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/payment-terms:
    get:
      summary: Conditions de paiement actives
      responses:
        '200':
          description: Conditions de paiement, par ordre d'affichage
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/sales-reps:
    get:
      summary: Commerciaux affectables
      description: Utilisateurs détenant clients.write.
      responses:
        '200':
          description: Liste des commerciaux
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/users/directory:
    get:
      summary: Noms des utilisateurs de la société
      parameters:
        - name: ids
          in: query
          required: true
          description: Identifiants séparés par des virgules (100 au maximum).
          schema:
            type: string
      responses:
        '200':
          description: Utilisateurs trouvés (identifiant, nom, e-mail)
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/notifications:
    get:
      summary: Mes notifications internes (les plus récentes d'abord)
      description: |
        Seules les notifications du destinataire connecté sont renvoyées (politique RLS). Chaque notification est dédupliquée
        par destinataire et par événement : une relance ne crée jamais de doublon. Pagination : page, per_page (max 100).
        ETag : la réponse porte un ETag ; renvoyer If-None-Match donne 304 si rien n'a changé.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: unread
          in: query
          description: '1 = seulement les notifications non lues'
          schema: { type: string, enum: ['1'] }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Liste paginée
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '304':
          description: Inchangé depuis l'ETag fourni
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/notifications/{id}/read:
    post:
      summary: Marquer une notification comme lue
      description: 'Idempotent : relire une notification déjà lue ne change rien. Une notification d''autrui renvoie 404.'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Marquée lue
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/events/failures:
    get:
      summary: Événements en échec ou arrêtés, avec leur cause
      description: Droit events.read (appliqué par la base). Un événement « failed » est réessayé automatiquement ; « dead » est arrêté après 5 tentatives et doit être relancé.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Liste des échecs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventFailure'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/events/dispatch:
    post:
      summary: Traiter la file des événements non encore traités
      description: Droit events.replay. Relancer cette action ne traite jamais deux fois un même événement (réponses already_done).
      responses:
        '200':
          description: Compteurs du passage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      done: { type: integer }
                      failed: { type: integer }
                      dead: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/events/{id}/replay:
    post:
      summary: Relancer le traitement d'un événement pour un consommateur en échec
      description: |
        Droit events.replay. En-tête Idempotency-Key OBLIGATOIRE (8 à 120 caractères) : même clé et même requête renvoient
        la réponse enregistrée (en-tête Idempotent-Replayed: true) ; même clé avec une autre requête → 422 IDEMPOTENCY_KEY_REUSED.
        Seules les réponses réussies sont enregistrées : un échec peut être repris avec la même clé.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumer]
              properties:
                consumer:
                  type: string
                  enum: [notify_internal]
      responses:
        '200':
          description: Résultat du replay
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      event_id: { type: string, format: uuid }
                      consumer: { type: string }
                      result:
                        type: string
                        enum: [done, already_done, failed, dead]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Invalid:
      description: Donnée refusée (validation ou règle métier)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Jeton manquant, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Droit insuffisant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ressource introuvable ou non accessible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Doublon (nom ou numéro fiscal déjà utilisé)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: Données invalides
      content:
        application/json:
          schema:
            type: object
            required: [error, message, errors]
            properties:
              error:
                type: string
                example: VALIDATION_FAILED
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
  parameters:
    ClientId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClientPath:
      name: client
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AddressId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        full_name: { type: string }
        job_title: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        language: { type: string, nullable: true }
        is_primary: { type: boolean }
        notes: { type: string, nullable: true }
    ContactInput:
      type: object
      required: [full_name]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 100 }
        job_title: { type: string, maxLength: 100, nullable: true }
        email: { type: string, format: email, maxLength: 160, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        mobile: { type: string, maxLength: 40, nullable: true }
        language: { type: string, nullable: true, description: 'Code langue (fr, en, de, es, it, nl)' }
        is_primary: { type: boolean }
        notes: { type: string, maxLength: 1000, nullable: true }
    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        type: { type: string, enum: [head_office, billing, delivery, other] }
        label: { type: string, nullable: true }
        line1: { type: string }
        line2: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        city: { type: string }
        region: { type: string, nullable: true }
        country: { type: string, description: 'Code pays ISO-2' }
        is_default: { type: boolean }
        notes: { type: string, nullable: true }
    AddressInput:
      type: object
      required: [type, line1, city, country]
      properties:
        type: { type: string, enum: [head_office, billing, delivery, other] }
        label: { type: string, maxLength: 60, nullable: true }
        line1: { type: string, minLength: 2, maxLength: 160 }
        line2: { type: string, maxLength: 160, nullable: true }
        postal_code: { type: string, maxLength: 20, nullable: true }
        city: { type: string, minLength: 1, maxLength: 80 }
        region: { type: string, maxLength: 80, nullable: true }
        country: { type: string, description: 'Code pays ISO-2 présent dans la configuration' }
        is_default: { type: boolean }
        notes: { type: string, maxLength: 1000, nullable: true }
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: UNAUTHENTICATED
        message:
          type: string
    Health:
      type: object
      required: [status, database, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
        version:
          type: string
          example: v1
    Client:
      type: object
      required: [id, code, name, country, currency, language]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: CL-0001
        name:
          type: string
        country:
          type: string
          pattern: '^[A-Z]{2}$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        language:
          type: string
          enum: [fr, en, de, es, it, nl]
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    ClientInput:
      type: object
      description: Champs acceptés en création (name, country, currency, language obligatoires) et en modification (tous facultatifs).
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{1,19}$'
        name:
          type: string
          minLength: 2
          maxLength: 120
        legal_name:
          type: string
          maxLength: 160
        tax_id:
          type: string
          maxLength: 40
        registration_no:
          type: string
          maxLength: 40
        website:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 160
        phone:
          type: string
          maxLength: 40
        country:
          type: string
          enum: [TN, FR, DE, BE, NL, LU, IT, ES, PT, GB, IE, CH, AT, SE, DK, NO, FI, IS, PL, CZ, SK, HU, RO, BG, GR, HR, SI, EE, LV, LT, MT, CY, MA, DZ, LY, EG, TR, AE, SA, QA, US, CA, CN, JP]
        currency:
          type: string
          enum: [EUR, TND, USD, GBP, CHF, SEK, DKK, NOK, PLN, CZK, MAD]
        language:
          type: string
          enum: [fr, en, de, es, it, nl]
        payment_method:
          type: string
          enum: [transfer, cheque, lc, cash, other]
        credit_limit:
          type: number
          minimum: 0
          maximum: 1000000000
        incoterm:
          type: string
          enum: [EXW, FCA, FAS, FOB, CFR, CIF, CPT, CIP, DAP, DPU, DDP]
        vat_exempt:
          type: boolean
        delivery_tolerance_pct:
          type: number
          minimum: 0
          maximum: 50
        aql_level:
          type: string
          maxLength: 20
        notes:
          type: string
          maxLength: 2000
    ClientPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        meta:
          type: object
          required: [page, per_page, total]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
    NotificationPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          type: object
          required: [page, per_page, total]
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
    Notification:
      type: object
      required: [id, kind, title, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [approval_todo, approval_result] }
        title: { type: string }
        body: { type: [string, 'null'] }
        link: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
    EventFailure:
      type: object
      required: [event_id, event_type, consumer, status, attempts]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string, example: 'approval.refuse' }
        consumer: { type: string }
        status: { type: string, enum: [failed, dead] }
        attempts: { type: integer, minimum: 0, maximum: 5 }
        last_error: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }
